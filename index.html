<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antony Saldana | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--line:#d6f4ff;--acc:#3fd0ff;--dim:rgba(214,244,255,.55);--glass:rgba(4,16,28,.62);--hue:0deg;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(10,14,22,.58)}}
:root[data-theme="dark"]{--glass:rgba(10,14,22,.58)}
html,body{height:100%;margin:0;overflow:hidden;background:#02070c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{color:var(--line);font-family:'Share Tech Mono',ui-monospace,Menlo,monospace;font-size:14px;position:relative}
body.combat{--acc:#ff3b2f;--line:#ffe3df;--dim:rgba(255,227,223,.55);--glass:rgba(28,6,6,.62)}
.orb{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
#scene{position:absolute;inset:-4%;transition:transform .25s ease-out,filter .6s}
#scene{filter:blur(.6px) saturate(1.1)}
#scene .sc{position:absolute;inset:0;opacity:0;transition:opacity 1s}#scene .sc.on{opacity:1}
#scene svg{width:100%;height:100%;display:block}
body.combat #scene{filter:blur(.6px) sepia(1) saturate(2.6) hue-rotate(-42deg) brightness(.85)}
.fl{animation:fl 2s linear infinite}@keyframes fl{to{stroke-dashoffset:-24}}
#helm{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#glass{position:fixed;inset:0;z-index:6;pointer-events:none;background:linear-gradient(112deg,transparent 18%,rgba(190,235,255,.055) 24%,transparent 31%,transparent 58%,rgba(190,235,255,.04) 63%,transparent 69%),radial-gradient(ellipse at 30% 20%,rgba(190,235,255,.05),transparent 55%)}
#gl{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--acc) 40%,transparent) 0 2px,transparent 2px 6px)}
#gl.go{animation:gl .6s ease-out}@keyframes gl{0%{opacity:0}15%{opacity:.5}100%{opacity:0}}
.pl{position:fixed;left:0;right:0;height:50.3%;background:linear-gradient(#010203,#06121a);z-index:45;pointer-events:none;transition:transform 1.2s cubic-bezier(.7,0,.2,1)}
.pl.t{top:0;border-bottom:2px solid var(--acc);box-shadow:0 2px 24px var(--acc)}.pl.b{bottom:0;border-top:2px solid var(--acc);box-shadow:0 -2px 24px var(--acc)}
body.open .pl.t{transform:translateY(-102%)}body.open .pl.b{transform:translateY(102%)}
.cd{animation:cl 70s linear infinite alternate}.cd.b{animation-duration:110s}
@keyframes cl{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
.sh{animation:sh 5s ease-in-out infinite alternate}
@keyframes sh{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
#fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%),repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.14) 3px);z-index:2}
.helmet{position:absolute;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.8);border-radius:40px/30px}
#hud{position:absolute;inset:0;z-index:5}
svg.l{stroke:var(--line);fill:none}
#tick{position:absolute;top:0;left:0;right:0;height:24px;overflow:hidden;border-bottom:1px solid var(--dim);background:rgba(0,0,0,.35);padding-top:env(safe-area-inset-top,0px);height:calc(24px + env(safe-area-inset-top,0px));font-size:.68rem;color:var(--acc);white-space:nowrap}
#tick div{display:inline-block;padding-top:4px;animation:tk 40s linear infinite}
@keyframes tk{to{transform:translateX(-50%)}}
#voice{position:absolute;left:24px;top:calc(40px + env(safe-area-inset-top,0px));max-width:min(340px,60vw)}
#voice .n{color:var(--acc);font-size:.75rem}
#voice .w{display:flex;gap:3px;height:16px;align-items:center;margin:6px 0}
#voice .w i{width:3px;background:var(--line);animation:wave 1s ease-in-out infinite;height:4px}
@keyframes wave{50%{height:16px}}
#vline{font-size:.85rem;min-height:3.8em}
#reticle{position:absolute;left:30%;top:54%;width:min(36vw,50vh,430px);aspect-ratio:1;transform:translate(-50%,-50%)}
#reticle svg{width:100%;height:100%;overflow:visible}
.sp{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.sp.r{animation-duration:22s;animation-direction:reverse}.sp.f{animation-duration:12s}
@keyframes spin{to{transform:rotate(360deg)}}
.hs{cursor:pointer}.hs circle.d{fill:var(--acc);stroke:none}
.hs circle.pr{stroke:var(--acc);transform-box:fill-box;transform-origin:center;animation:pr 1.8s ease-out infinite}
.hs text{fill:var(--line);stroke:none;font-size:6.5px;letter-spacing:.08em;font-family:'Share Tech Mono',monospace;opacity:.85}
.hs:hover circle.d,.hs.act circle.d{fill:#fff}.hs:hover text,.hs.act text{fill:var(--acc);opacity:1}
@keyframes pr{from{transform:scale(1);opacity:1}to{transform:scale(3.4);opacity:0}}
#reticle .lbl{position:absolute;left:50%;top:104%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#reticle .lbl b{display:block;font-family:'Orbitron',sans-serif;font-size:clamp(.9rem,1.8vw,1.4rem);letter-spacing:.2em}
#reticle .lbl span{color:var(--acc);font-size:.72rem}
#panel{position:absolute;left:46%;top:calc(76px + env(safe-area-inset-top,0px));width:min(480px,46vw);max-height:58vh;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(6px);border:1px solid var(--line);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
#panel header{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--dim);color:var(--acc);font-size:.72rem}
#body{padding:14px;overflow-y:auto;line-height:1.55;scrollbar-width:thin}
#body h3{margin:0 0 8px;font-size:1rem;color:var(--acc);font-family:'Orbitron',sans-serif;letter-spacing:.1em;text-transform:uppercase}
#body p{margin:0 0 10px}.dim{color:var(--dim)}
.tag,.chip{display:inline-block;border:1px solid var(--dim);padding:1px 8px;margin:4px 4px 0 0;font-size:.74rem;cursor:help;transition:.15s}
.chip:hover,.tag:hover{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);transform:translateY(-2px)}
.file{display:block;width:100%;text-align:left;background:transparent;color:var(--line);font:inherit;border:1px solid var(--dim);padding:8px 10px;margin-bottom:8px;cursor:pointer}
.file:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);padding-left:18px;transition:.15s}.file small{color:var(--acc)}
.red{background:var(--line);color:transparent;user-select:none;display:inline-block;height:.8em;vertical-align:middle}
.btn{display:inline-block;color:var(--line);background:transparent;font:inherit;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;padding:7px 14px;margin:0 6px 6px 0;border:1px solid var(--line);cursor:pointer}
.btn:hover{background:var(--acc);border-color:var(--acc);color:#10080a}
.mc{border:1px solid var(--dim);padding:10px;margin-bottom:10px;cursor:help}.mc:hover{border-color:var(--acc)}.mc b{color:var(--acc)}
.tlm{border-left:1px solid var(--acc);padding-left:14px}.tlm>div{margin-bottom:12px;padding:4px 6px;cursor:help}.tlm>div:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}.tlm b{color:var(--acc)}
.photo{float:right;width:112px;margin:0 0 8px 12px;padding:4px;border:1px solid var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 35%,transparent);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.photo img{display:block;width:100%;height:auto}
#body ul{padding-left:18px;margin:0 0 10px}#body li{margin-bottom:6px}
.photo{box-shadow:0 0 16px color-mix(in srgb,var(--acc) 40%,transparent)}
.sb{animation:sb 4.2s linear infinite}@keyframes sb{to{transform:translateY(200px)}}
#visor{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#visor path{fill:none;stroke:var(--acc);vector-effect:non-scaling-stroke}
#suit{position:absolute;left:18px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:104px;height:172px;filter:drop-shadow(0 0 6px var(--acc))}
#suit text{fill:var(--line);stroke:none;font:7px 'Share Tech Mono',monospace}
#tg{position:absolute;left:50%;top:calc(30px + env(safe-area-inset-top,0px));width:min(500px,42vw);transform:translateX(-50%);pointer-events:none;overflow:visible}
#tg text{fill:var(--line);stroke:none;font:9px 'Share Tech Mono',monospace}
@media (max-width:1100px),(max-height:760px){#suit{display:none}}
@media (max-width:1000px){#tg{display:none}}
#radial button{touch-action:none}
#log{height:150px;overflow-y:auto;white-space:pre-wrap;font-size:.82rem;margin-bottom:8px}#log .u{color:var(--dim)}
#cmd{display:flex;gap:8px}
#cmd input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--line);font:inherit;outline:0;padding:4px}
#ld,#hl{position:absolute;inset:0;pointer-events:none}
#left{position:absolute;left:18px;top:54%;transform:translateY(-50%);display:flex;gap:12px}
#ruler{width:26px;height:min(46vh,380px);border-right:2px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 10px);position:relative;mask:linear-gradient(transparent,#000 15%,#000 85%,transparent)}
#ruler::after{content:"";position:absolute;right:-10px;top:var(--m,50%);border:6px solid transparent;border-right-color:var(--acc);transform:translateY(-6px);transition:top 1s}
#tele{font-size:.68rem;display:flex;flex-direction:column;gap:10px;justify-content:center}
#tele div{border:1px solid var(--dim);padding:3px 8px;width:130px;display:flex;justify-content:space-between;cursor:help}
#tele div:hover{border-color:var(--acc)}#tele b{color:var(--acc);font-weight:400}
#radial{position:absolute;right:0;top:54%}
#radial button{position:absolute;width:54px;height:54px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--line);cursor:pointer;transform:translate(-50%,-50%);font-family:'Orbitron',sans-serif;font-size:.8rem;transition:box-shadow .2s}
#radial button span{position:absolute;right:66px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Share Tech Mono',monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);pointer-events:none}
#radial button.on,#radial button:hover{border-color:var(--acc);color:var(--acc);box-shadow:0 0 16px var(--acc)}#radial button.on span{color:var(--acc)}
#arc{position:absolute;right:0;top:54%;overflow:visible;pointer-events:none}
#timer{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);text-align:center}
#timer b{font-family:'Orbitron',sans-serif;font-size:clamp(1.3rem,3vw,2.2rem);letter-spacing:.12em;font-weight:500}
#timer div{font-size:.68rem;color:var(--acc)}
#tools{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#tools button{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--line);font:inherit;cursor:pointer;font-size:.66rem}
#tools button:hover,#tools button.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px var(--acc)}
#bar{display:none}
#tip{position:fixed;z-index:30;max-width:270px;background:rgba(8,12,18,.9);border:1px solid var(--acc);padding:8px 11px;pointer-events:none;opacity:0;transition:opacity .15s;left:0;top:0;font-size:.78rem;line-height:1.45;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
#tip.on{opacity:1}#tip b{display:block;color:var(--acc);font-family:'Orbitron',sans-serif;letter-spacing:.12em;font-size:.72rem;margin-bottom:3px}#tip p{margin:0}
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:40;display:none;transition:width .15s,height .15s,margin .15s}
#cur.h{width:50px;height:50px;margin:-25px 0 0 -25px}
@media (pointer:fine){#cur{display:block}}
.rp{position:fixed;width:10px;height:10px;margin:-5px;border:1px solid var(--acc);border-radius:50%;pointer-events:none;z-index:39;animation:rp .7s ease-out forwards}
@keyframes rp{to{transform:scale(8);opacity:0}}
#lens{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:.62rem;color:var(--dim);white-space:nowrap}
#boot{position:absolute;inset:0;z-index:50;background:#05080d;display:grid;place-items:center;text-align:center;transition:opacity .9s}
#boot.off{opacity:0;pointer-events:none}
@media (max-width:1100px){#left{display:none}}
@media (max-width:820px){
 .photo{width:90px}
 #radial,#arc,#ld{display:none}
 #reticle{left:50%;top:25%;width:min(46vw,200px)}
 #voice{display:none}
 #panel{left:12px;right:12px;width:auto;top:45%;max-height:calc(55vh - 130px)}
 #bar{display:flex;position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:6px;padding:0 10px;z-index:6}
 #bar button{flex:0 0 auto;background:var(--glass);border:1px solid var(--line);color:var(--line);font:inherit;padding:8px 10px;text-transform:uppercase;font-size:.7rem}
 #bar button.on{border-color:var(--acc);color:var(--acc)}
 #timer{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;transform:none;text-align:left}#lens{display:none}
 #tools{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
 #reticle .lbl{top:101%}#reticle .lbl b{font-size:.8rem}#reticle .lbl span{font-size:.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#intro{position:fixed;inset:0;z-index:60;background:#04070b;display:flex;align-items:center;justify-content:center;transition:opacity .9s;overflow:hidden;color:#dff6ff;font-family:'Share Tech Mono',ui-monospace,monospace}
#intro.off{opacity:0;pointer-events:none}
.in-grid{position:absolute;inset:0;background:linear-gradient(rgba(95,227,255,.06) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(95,227,255,.06) 1px,transparent 1px) 0 0/48px 48px,radial-gradient(ellipse at 50% 55%,rgba(95,227,255,.16),transparent 62%)}
.in-scan{position:absolute;left:0;right:0;height:3px;top:-5%;background:#5fe3ff;box-shadow:0 0 24px 6px #5fe3ff;opacity:0}
.in-scan.go{animation:insc 1.5s ease-in-out forwards}@keyframes insc{0%{top:-5%;opacity:.9}100%{top:105%;opacity:0}}
.in-rings{position:absolute;width:min(80vh,92vw);aspect-ratio:1;pointer-events:none}.in-rings svg{width:100%;height:100%;overflow:visible}
.in-sp{transform-box:fill-box;transform-origin:center;animation:insp 40s linear infinite}.in-sp.r{animation-duration:24s;animation-direction:reverse}@keyframes insp{to{transform:rotate(360deg)}}
#insuit{height:min(88vh,150vw);max-width:96vw;position:relative;z-index:2;overflow:visible}
.ip{opacity:0;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));transition:transform .85s cubic-bezier(.2,.9,.25,1.08),opacity .4s}
.ip.on{opacity:1;transform:none;animation:insnap .9s ease-out}
@keyframes insnap{0%{filter:brightness(3) drop-shadow(0 0 14px #ffd24a)}100%{filter:none}}
#inface{transform:translateY(-60px);opacity:0;transition:transform .7s cubic-bezier(.3,.8,.3,1),opacity .3s}#inface.on{transform:none;opacity:1}
.in-eye{fill:#e9fbff;filter:drop-shadow(0 0 6px #5fe3ff);opacity:0;transition:opacity .4s .45s}#inface.on .in-eye{opacity:1}
#icore{fill:#eafcff;filter:drop-shadow(0 0 8px #5fe3ff) drop-shadow(0 0 20px #5fe3ff);opacity:0;transition:opacity .5s}#icore.on{opacity:1;animation:inpl 2s ease-in-out infinite}@keyframes inpl{50%{opacity:.6}}
.in-hand{fill:#eafcff;opacity:0;transition:opacity .5s;filter:drop-shadow(0 0 8px #5fe3ff)}.in-hand.on{opacity:.95}
#inlog{position:absolute;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:.74rem;color:rgba(223,246,255,.6);z-index:4;min-width:210px}
#inlog b{color:#5fe3ff;font-weight:400}#inbar{height:4px;background:rgba(255,255,255,.12);margin-top:8px}#inbar i{display:block;height:100%;width:0;background:#5fe3ff;box-shadow:0 0 10px #5fe3ff;transition:width .5s}
#inwelcome{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-family:'Orbitron',sans-serif;letter-spacing:.3em;font-size:clamp(.8rem,2vw,1.1rem);color:#5fe3ff;z-index:4;opacity:0;transition:opacity .6s}#inwelcome.on{opacity:1}
#inskip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:.72rem;letter-spacing:.14em;background:none;color:rgba(223,246,255,.6);border:1px solid rgba(223,246,255,.4);padding:7px 12px;cursor:pointer;z-index:5}
#inskip:hover{color:#5fe3ff;border-color:#5fe3ff}
#instart{position:absolute;inset:0;z-index:8;background:#04070b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;transition:opacity .5s}#instart.off{opacity:0;pointer-events:none}
#instart button{font-family:'Orbitron',sans-serif;letter-spacing:.3em;font-size:1rem;color:#5fe3ff;background:none;border:1px solid #5fe3ff;padding:16px 30px;cursor:pointer;box-shadow:0 0 22px rgba(95,227,255,.35),inset 0 0 14px rgba(95,227,255,.2);animation:inpl 2s infinite}
#inflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}#inflash.go{animation:infl .8s ease-out}@keyframes infl{0%{opacity:.9}100%{opacity:0}}
#radial,#arc{right:-90px}
@media (min-width:821px){#panel{width:min(440px,40vw)}}
#panel{opacity:0;pointer-events:none;transform:translateX(18px);transition:opacity .35s,transform .35s}
#panel.show{opacity:1;pointer-events:auto;transform:none}
#ld{transition:opacity .35s}body:not(.pshow) #ld{opacity:0}
#reticle,#radial,#arc,#bar,#left,#timer,#tools,#lens{transition:opacity .9s}
.f-ret #reticle,.f-dial #radial,.f-dial #arc,.f-dial #bar,.f-ui #left,.f-ui #timer,.f-ui #tools,.f-ui #lens{opacity:0!important;pointer-events:none!important}
#fcv{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s}#fcv.on{opacity:1}

#call{position:fixed;left:50%;top:50%;z-index:12;transform:translate(-50%,-40%) scale(.92);opacity:0;pointer-events:none;transition:.5s;width:min(340px,86vw);text-align:center;padding:26px 20px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--acc);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
#call.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#call .rg{position:relative;width:90px;height:90px;margin:0 auto 14px}
#call .rg i{position:absolute;inset:0;border:1px solid var(--acc);border-radius:50%;animation:cr 1.8s ease-out infinite}#call .rg i:nth-child(2){animation-delay:.6s}#call .rg i:nth-child(3){animation-delay:1.2s}
#call .rg::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc)}
@keyframes cr{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
#call small{color:var(--acc);font-size:.7rem}#call b{display:block;font-family:'Orbitron',sans-serif;letter-spacing:.24em;font-size:1.15rem;margin:6px 0 2px}

#fskip{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:13;font:inherit;font-size:.68rem;letter-spacing:.16em;background:rgba(0,0,0,.4);color:var(--dim);border:1px solid var(--dim);padding:6px 12px;cursor:pointer;transition:opacity .5s}
#fskip.off{opacity:0;pointer-events:none}#fskip:hover{color:var(--acc);border-color:var(--acc)}

#sline.go{animation:insc 1.8s ease-in-out forwards}

var DATA={
 projects:[{"id": "PRJ-001", "sc": 1, "t": "IoT Smart Watering System", "m": "Hoboken, NJ // Sep-Dec 2025", "tags": ["ESP32", "C++/Arduino", "MQTT", "SolidWorks"], "s": "An ESP32 plant waterer that streams its data to the cloud.", "b": ["Designed and 3D printed a SolidWorks enclosure (3 hr 35 min print) for the ESP32, motor controller, and sensors, adding dedicated cable routing and USB access to keep the electronics organized, protected, and easy to service.", "Built an ESP32 system in C++/Arduino that reads 4 environmental variables (soil moisture, light, temperature, humidity) and automatically waters the plant when moisture drops below 30%, removing the need for manual checks.", "Established secure MQTT (TLS) streaming to a HiveMQ cloud broker every 10 minutes, collecting 6 days of data (roughly 860 readings per sensor) and rebuilding the circuit after water damage to keep the system running."]}, {"id": "PRJ-002", "sc": 2, "t": "Autonomous Navigation Robot", "m": "Howl's Moving Castle // Hoboken, NJ // Jan-May 2026", "tags": ["WeMos D1", "C++/Arduino", "MQTT", "SolidWorks"], "s": "A 3-person robot that scored 133% on the course.", "b": ["Designed and wired the electrical system for a 3-person autonomous robot using a WeMos D1, 3 ultrasonic sensors, an I2C OLED display, and a PWM motor driver, giving the robot the obstacle detection and control it needed to navigate.", "Built a color-coded wiring layout with a shared 5V power/ground hub so the robot could navigate to 4 targets using real-time MQTT position data, keeping the wiring clean and easy for all three teammates to troubleshoot.", "Achieved a 1 min 26 sec run of the 4-target course with 0 collisions by integrating the ultrasonic sensors, motor driver, and MQTT position data, finishing 94 sec under the 3 min limit and scoring 199/150 (133%)."]}, {"id": "PRJ-003", "sc": 3, "t": "Tunnel Catwalk Camera", "m": "Lincoln & Holland Tunnel // Port Authority of NY & NJ challenge // New York, NY // Sep-Nov 2023", "tags": ["Python", "Robotics"], "s": "A 360-degree rotating camera for the Lincoln and Holland Tunnel catwalk challenge.", "b": ["Designed and coded a 360-degree rotating Python camera system for the Port Authority of NY & NJ tunnel catwalk challenge, giving operators a full view of the tunnel from a single camera mounted on the catwalk itself.", "Built a mobile base so the camera could travel along the tunnel catwalk, allowing one device to monitor far more of the tunnel than a fixed camera could and reducing the need for multiple separate camera units.", "Facilitated real-time remote monitoring of vehicle stoppages and other situations in the tunnel using the rotating camera, allowing problems to be spotted without sending someone onto the catwalk and giving operators a clearer view."]}],
 exp:[["External Relations Chair, SHPE", "Society of Hispanic Professional Engineers, Hoboken NJ // Mar 2025-Present", "Builds partnerships with companies and chapters and works to empower underrepresented students in STEM.", ["Establish connections with companies, organizations, and other SHPE chapters through outreach and ongoing communication to create new opportunities, partnerships, and career resources for chapter members.", "Promote SHPE at campus and external events while coordinating with professionals on collaborations and career opportunities, strengthening the chapter's relationships with companies and professional organizations."]], ["President and 3D Printer Technician, Robotics Club", "Hillside High School, NJ // Sep 2023-Jun 2024", "Led the club and kept its 3D printers running.", ["Led the Robotics Club as President, organizing meetings, managing team projects, and guiding members through hands-on robotics and design challenges to build their technical skills, teamwork, and problem-solving abilities.", "Streamlined 3D printing workflows by training members on slicing software, calibration, and printer safety while operating and repairing the printers, boosting club efficiency and part quality for team builds and prototypes."]], ["Shift Lead, WingStop", "Hoboken, NJ // Jan-Jun 2026", "Led shifts of 5-10 employees serving 100+ customers per shift.", ["Led shifts of 5-10 employees, assigning tasks and coordinating service during busy, high-volume periods to serve 100+ customers per shift while handling orders, customer concerns, and food quality, keeping service moving smoothly.", "Managed cash, inventory, food safety, and closing procedures while training new employees, helping the store run smoothly and consistently from opening through closing and keeping new team members prepared and confident on the job."]], ["Guest Advocate, Target", "Clark, NJ // Sep 2023-Jun 2024", "Held a 98% satisfaction rate and improved Drive Up workflow.", ["Assisted 50+ customers per shift, resolving product, pricing, and service inquiries to maintain a 98% satisfaction rate, and improved Drive Up workflow and communication among team members to boost overall team efficiency by 60%.", "Reprogrammed ZEBRA barcode devices used at checkout to improve scan accuracy and speed, reducing checkout delays by 25% and helping guests check out faster while keeping the front end moving during busy periods."]]],
 skills:[["Python","Used for the tunnel catwalk camera system."],["C++ / Arduino","Firmware for the ESP32 and WeMos D1 projects."],["SolidWorks","Designed and 3D printed project enclosures."],["Fusion 360","Experienced with Fusion 360 for 3D modeling."],["ESP32 / WeMos D1","Microcontroller builds with sensors, motor drivers, and displays."],["MQTT","Secure TLS data streaming to a HiveMQ broker."],["3D printer maintenance","Operated, calibrated, and repaired printers for Robotics Club."],["Leadership","External Relations Chair for SHPE, Robotics Club President."],["Teamwork","Collaborates across projects and organizations."],["Communication","Builds partnerships on behalf of SHPE."]],
 langs:[["English","Fluent"],["Spanish","Intermediate"]],

</script><script>(function(){
